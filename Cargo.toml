[package]
name = "oidc-rp"
description = "Implements OIDC Relying Party wrapper"
version = "0.0.1"
edition = "2024"
authors = ["Leonard Marschke <leo@mixxplorer.de>"]
readme = "Readme.md"
repository = "https://rechenknecht.net/mixxplorer/libraries/oidc-rp"
license = "MIT OR Apache-2.0"
keywords = ["oidc", "oauth", "authentication"]
categories = ["authentication"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.1", features = ["macros"], optional = true }
chrono = "0.4"
futures-util = { version = "0.3.34", optional = true }
log = "~0.4"
openidconnect = { git = "https://github.com/mixxplorer/openidconnect-rs.git", branch = "feature/jwt-access-tokens", default-features = false, features = ["timing-resistant-secret-traits", "reqwest-blocking", "jwt-access-token"] }
reqwest = { version = "0.12", features = ["http2", "rustls-tls-native-roots", "brotli", "json"] }
serde = { version = "1", features = ["std", "derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.37.0", features = ["sync", "macros"] }
tokio-util = { version = "0.7" }
tower = { version = "0.5.3", optional = true }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
aide = { version = "0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query", "redoc", "macros"] }
anyhow = "~1.0.82"
clap = { version = "4.6", features = ["derive"] }
clap-verbosity-flag = "2.2"
ctrlc = "3.5.2"
indexmap = "2.14.2"
log = "~0.4.21"
rand = "0.10.2"
schemars = { version = "1.0.4" }
simple_logger = { version = "~5.2.0", features = ["colors", "timestamps", "stderr"] }
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"

[features]
integration-axum = ["dep:axum", "dep:tower", "dep:futures-util"]
special-reqwest-client = []

[badges]
maintenance = { status = "experimental" }

[profile.release]
lto = true
panic = "abort"
opt-level = 'z'

[[example]]
name = "account"
path = "examples/account/main.rs"
crate-type = ["bin"]

[[example]]
name = "auth_verify"
path = "examples/auth_verify/main.rs"
crate-type = ["bin"]

[[example]]
name = "jwks"
path = "examples/jwks/main.rs"
crate-type = ["bin"]

[[example]]
name = "pkce"
path = "examples/pkce/main.rs"
crate-type = ["bin"]

[[example]]
name = "axum"
path = "examples/axum/main.rs"
crate-type = ["bin"]
required-features = ["integration-axum"]
